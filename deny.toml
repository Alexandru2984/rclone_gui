# cargo-deny configuration: license compliance, dependency bans, and sources.
# Run locally with:  cargo deny check

[advisories]
version = 2
# Vulnerabilities are also covered by the cargo-audit workflow; keep this in sync.
yanked = "warn"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Licenses currently present in the locked graph and compatible with this
# project's GPL-3.0-or-later. Extend only when a reviewed dependency needs it.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
# The GTK stack legitimately pulls multiple versions of small crates.
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
