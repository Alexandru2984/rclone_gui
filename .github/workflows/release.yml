name: Release

# Build release artifacts with read-only jobs. The repository write token exists
# only in the final publishing job, after both build artifacts are complete.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deb:
    name: build .deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c0e9df88980754dd93e5833b8dcb1b304c1fe173 # 1.96.0
      - name: Require the tag to match Cargo.toml
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "cascade-gui") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - name: Install cargo-deb 3.7.0
        run: cargo install --locked --version 3.7.0 cargo-deb
      - name: Build the package
        run: cargo deb --locked -p cascade-gui
      - name: Stage the Debian artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-deb
          path: target/debian/*.deb
          if-no-files-found: error
          retention-days: 1

  appimage:
    name: build AppImage
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d
      GTK_PLUGIN_COMMIT: 7a3fbc31a9e5075073ff8790f26effbac5f84453
      GTK_PLUGIN_SHA256: b0f4cbc684a0103a9651f0955b635eaea0096b3a66c0f5a2c2aa337960375171
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@c0e9df88980754dd93e5833b8dcb1b304c1fe173 # 1.96.0
      - name: Require the tag to match Cargo.toml
        run: |
          set -euo pipefail
          package_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "cascade-gui") | .version')"
          test "$GITHUB_REF_NAME" = "v$package_version"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev \
            librsvg2-dev libglib2.0-bin desktop-file-utils
      - name: Build release binary
        run: cargo build --locked -p cascade-gui --release
      - name: Fetch verified linuxdeploy inputs
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            --output linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          curl --proto '=https' --tlsv1.2 --fail --show-error --location --retry 3 \
            --output linuxdeploy-plugin-gtk.sh \
            "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/${GTK_PLUGIN_COMMIT}/linuxdeploy-plugin-gtk.sh"
          printf '%s  %s\n' "$LINUXDEPLOY_SHA256" linuxdeploy \
            "$GTK_PLUGIN_SHA256" linuxdeploy-plugin-gtk.sh \
            | sha256sum --check --strict
          chmod 0755 linuxdeploy linuxdeploy-plugin-gtk.sh
      - name: Build AppImage
        env:
          DEPLOY_GTK_VERSION: "4"
        run: |
          ./linuxdeploy --appdir AppDir \
            --executable target/release/cascade \
            --desktop-file packaging/io.github.alexmihai.Cascade.desktop \
            --icon-file packaging/icons/hicolor/scalable/apps/io.github.alexmihai.Cascade.svg \
            --plugin gtk \
            --output appimage
      - name: Stage the AppImage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cascade-appimage
          path: "*.AppImage"
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish verified artifacts
    needs: [deb, appimage]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate artifacts and create checksums
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1
          test "$(find release-assets -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test -z "$(find release-assets -maxdepth 1 -type l -print -quit)"
          cd release-assets
          sha256sum -- *.deb *.AppImage > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
      - name: Attest release provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/*.deb
            release-assets/*.AppImage
      - name: Create the release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
