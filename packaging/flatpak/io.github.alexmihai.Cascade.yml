# Flatpak manifest for Cascade.
#
# The bundled rsync/rclone checksums are pinned to their upstream releases.
# Cargo sources are generated deterministically from Cargo.lock and committed so
# the sandboxed build never needs network access:
#   python3 packaging/flatpak/generate-cargo-sources.py
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.alexmihai.Cascade.yml
#
# rclone and rsync are bundled so the sandboxed app never needs host binaries.
app-id: io.github.alexmihai.Cascade
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cascade

finish-args:
  # Run identically on Wayland and X11.
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # rclone/rsync need network and file access.
  - --share=network
  - --filesystem=home
  # Desktop notifications.
  - --talk-name=org.freedesktop.Notifications

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cascade/cargo

modules:
  # Bundled rsync.
  - name: rsync
    buildsystem: autotools
    config-opts:
      - --disable-debug
    sources:
      - type: archive
        url: https://download.samba.org/pub/rsync/src/rsync-3.4.1.tar.gz
        sha256: 2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52

  # Bundled rclone (official static binary).
  - name: rclone
    buildsystem: simple
    build-commands:
      - install -Dm755 rclone /app/bin/rclone
    sources:
      - type: archive
        url: https://downloads.rclone.org/v1.74.4/rclone-v1.74.4-linux-amd64.zip
        sha256: fe435e0c36228e7c2f116a8701f01127bb1f694005fc11d1f27186c8bca4115d
        strip-components: 1
        only-arches:
          - x86_64
      - type: archive
        url: https://downloads.rclone.org/v1.74.4/rclone-v1.74.4-linux-arm64.zip
        sha256: 97685285c9ad6a0cf17d5844115d2a67245af6444db672187074bd9c358de419
        strip-components: 1
        only-arches:
          - aarch64

  # Cascade itself (offline cargo build using the vendored cargo-sources.json).
  - name: cascade
    buildsystem: simple
    build-options:
      env:
        CARGO_NET_OFFLINE: 'true'
    build-commands:
      - cargo build --release --offline -p cascade-gui
      - install -Dm755 target/release/cascade /app/bin/cascade
      - install -Dm644 packaging/io.github.alexmihai.Cascade.desktop
        /app/share/applications/io.github.alexmihai.Cascade.desktop
      - install -Dm644 packaging/io.github.alexmihai.Cascade.metainfo.xml
        /app/share/metainfo/io.github.alexmihai.Cascade.metainfo.xml
      - install -Dm644 packaging/icons/hicolor/scalable/apps/io.github.alexmihai.Cascade.svg
        /app/share/icons/hicolor/scalable/apps/io.github.alexmihai.Cascade.svg
    sources:
      - type: dir
        path: ../..
      # Generated from Cargo.lock — see the header comment.
      - cargo-sources.json
